# Zostavenie produkčného obrazu u GitHubu a push do GHCR.
#
# Dôvod: `npm run build` (Vite/Rollup) si vypýta ~1,5 GB RAM. Na malom VPS,
# kde zároveň bežia databázy ostatných projektov, to zhodilo celý server.
# Server teraz obraz len stiahne – deploy trvá sekundy a nič nebuilduje.
#
# V Coolify prepni zdroj z "build from source" na hotový obraz:
#   ghcr.io/<vlastnik>/<repo>:latest

name: Build obrazu

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Zostaviť a pushnúť
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Stiahnuť zdroják
        uses: actions/checkout@v4

      - name: Pripraviť Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prihlásiť sa do GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action zároveň prevedie názov repozitára na malé písmená,
      # ktoré GHCR vyžaduje.
      - name: Odvodiť značky
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Zostaviť a pushnúť
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache medzi behmi: composer a npm vrstvy sa neinštalujú odznova.
          cache-from: type=gha
          cache-to: type=gha,mode=max
